# git-cliff config — генерация CHANGELOG.md + release notes из conventional commits.
# https://git-cliff.org/docs/configuration
#
# Используется .github/workflows/release-app.yml для подстановки в releaseBody
# на каждый тег v*.

[changelog]
header = """
# Changelog

Все заметные изменения wotold-desktop.
Формат: [Conventional Commits](https://www.conventionalcommits.org/).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {{ commit.message | upper_first | trim }} \
            {% if commit.id %}({{ commit.id | truncate(length=7, end="") }}){% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = ""

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^ci", group = "CI/CD" },
    { message = "^build", group = "Build" },
    { message = "^chore", group = "Chore" },
    { message = "^style", group = "Style" },
    { message = "^revert", group = "Reverts" },
    { message = ".*", skip = true },
]
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9].*"
skip_tags = ""
ignore_tags = ""
topo_order = false
sort_commits = "oldest"
