[workspace]
resolver = "2"
members = ["apps/desktop/src-tauri"]

# Кандидат на будущего члена: services/mcp (Этап 7),
# если MCP-сервер выносится отдельным Rust-бинарём.

[workspace.package]
version = "0.0.1"
edition = "2021"
rust-version = "1.77"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
