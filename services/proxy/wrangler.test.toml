# Test-only wrangler config для vitest-pool-workers / миниframe.
# Никаких реальных TODO_KV_NAMESPACE_ID — миниframe держит KV/R2 in-memory.

name = "wotold-proxy-test"
main = "src/index.ts"
compatibility_date = "2026-05-01"
compatibility_flags = ["nodejs_compat"]

[[kv_namespaces]]
binding = "QUOTA"
id = "test-quota"

[[kv_namespaces]]
binding = "AUTH"
id = "test-auth"

[[r2_buckets]]
binding = "STT_STAGING"
bucket_name = "wotold-stt-staging-test"

[vars]
TIER = "free"
QUOTA_STT_SECONDS_PER_DAY = "300"
QUOTA_LLM_TOKENS_PER_DAY = "5000"
STAGING_PRESIGN_TTL_SECONDS = "900"
STT_STAGING_BUCKET = "wotold-stt-staging-test"
ANTHROPIC_DEFAULT_MODEL = "claude-sonnet-4-6"
LLM_BACKEND = ""
GROQ_DEFAULT_MODEL = "llama-3.3-70b-versatile"
AUTH_STATE_TTL_SECONDS = "60"
AUTH_SESSION_TTL_SECONDS = "3600"
GOOGLE_OAUTH_CLIENT_ID = "test-google-client-id"
GOOGLE_OAUTH_CLIENT_SECRET = "test-google-secret"
APPLE_OAUTH_CLIENT_ID = ""
MICROSOFT_OAUTH_CLIENT_ID = ""
PUBLIC_BASE_URL = "http://test.wotold.local"
