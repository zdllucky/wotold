version: 2

# [TD-02] Actions запинены на commit-SHA (см. шапку любого workflow).
# Пин без автообновления = застывшие уязвимости, поэтому Dependabot обязателен:
# он читает трейлинг-комментарий `# vX.Y.Z` рядом с SHA и бампает оба вместе.
# Обновления приходят PR'ом — прогоняются через тот же CI, что и обычный код.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      # commitlint в этом репо требует conventional commits (см. commitlint.yml).
      prefix: ci
    groups:
      # Патчи и миноры одной пачкой — иначе 13 actions дают шум из 13 PR'ов.
      # Мажоры приходят отдельно: их надо читать глазами (ломающие изменения
      # входов, как с toolchain:/tool: при SHA-пине).
      actions-minor:
        update-types:
          - minor
          - patch

  # npm/pnpm. До этого экосистема не была описана вовсе, и зависимости
  # дрейфовали без единого PR, пока не накопились тридцатью алертами —
  # security-обновления приходят сами, обычные не приходили никогда.
  #
  # Одна запись на весь монорепо: Dependabot понимает pnpm-workspaces и
  # обходит все пять пакетов из корня.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
    groups:
      # Без группировки пять пакетов дают поток PR'ов, который перестают
      # читать — а непрочитанный PR ничем не лучше необновлённой зависимости.
      npm-minor:
        update-types:
          - minor
          - patch
    ignore:
      # Мажоры сборочного тулинга — отдельное решение, не поток.
      # astro тянет за собой @astrojs/starlight (peer ^7), vitest — 622 теста,
      # vite — конфигурацию двух приложений. Такие переезды делаются осознанно,
      # а не мержем зелёного PR.
      - dependency-name: astro
        update-types: [version-update:semver-major]
      - dependency-name: '@astrojs/starlight'
        update-types: [version-update:semver-major]
      - dependency-name: vitest
        update-types: [version-update:semver-major]
      - dependency-name: vite
        update-types: [version-update:semver-major]

  # Rust. Cargo.lock здесь общий на весь воркспейс.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    commit-message:
      prefix: chore
    groups:
      cargo-minor:
        update-types:
          - minor
          - patch
    ignore:
      # ort запинен точной версией (=2.0.0-rc.12) намеренно: rc-релизы ломают
      # API между собой, а от него зависит эмбеддер ассистента.
      - dependency-name: ort
