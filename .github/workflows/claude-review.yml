name: Claude PR Review

# [TD-02] Все actions запинены на полный commit-SHA; трейлинг-комментарий (# vX.Y.Z)
# — машинный контракт с Dependabot, он бампает SHA и версию вместе.
# Причина: mutable-теги (@v4, @beta, @stable) переписываются владельцем action'а,
# и компрометация тега = выполнение чужого кода на раннере с нашими секретами.
# Не заменять SHA обратно на тег — Dependabot сам предложит апгрейд PR'ом.

# [B8.8]: ECC-агенты на PR. Запуск:
#   1. Авто-комментарий ревью на pull_request: opened|synchronize|reopened
#   2. Ondemand: коммент в PR с упоминанием "@claude" (например "@claude посмотри auth")
#
# Использует официальный anthropics/claude-code-action@beta. Требует
# repo secret ANTHROPIC_API_KEY (отдельно от партнёрских ключей прокси —
# чтобы не дать ревьюверу доступ к боевому Anthropic-ключу владельца).
#
# Если secret не выставлен — джоба тихо скипается, чтобы PR не блокировался.

on:
  pull_request:
    types: [opened, synchronize, reopened]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write
  id-token: write

jobs:
  claude-review:
    name: Claude review
    runs-on: ubuntu-latest
    # Гейт по наличию ANTHROPIC_API_KEY и контексту PR (не на форках без секретов
    # и не на ботах). На @claude-меншене в обычном комменте — проверяем что
    # коммент в PR (не в issue).
    #
    # [public-repo] Комментарные триггеры дополнительно ограничены по
    # author_association. До публикации репозитория комментировать мог только
    # владелец, и ограничение было бы бессмысленным; на публичном репозитории
    # `@claude` в комментарии мог бы написать кто угодно, а джоба ходит в
    # платный API и имеет `pull-requests: write` + `issues: write`. Это два
    # разных вектора: неограниченный расход бюджета владельца и бот, которым
    # посторонний рулит текстом своего комментария (тело комментария и есть
    # промпт). OWNER / MEMBER / COLLABORATOR закрывают оба, не мешая работе.
    #
    # Ветка pull_request остаётся как была: она уже отсечена по
    # head.repo.full_name, то есть форк-PR до секрета не доходит.
    #
    # author_association закрывает «кто зовёт», но не «что читается»: мейнтейнер,
    # написавший @claude под форк-PR, скармливает модели дифф постороннего.
    # Для pull_request_review_comment в payload есть head-репозиторий — добавлена
    # та же проверка. У issue_comment этого поля нет: payload описывает issue, а
    # не PR, и происхождение ветки оттуда не достаётся без отдельного запроса к
    # API. Остаточный риск принят: код с форка не исполняется (`contents: read`,
    # Bash не выдан), максимум — комментарий бота, сформированный чужим текстом.
    if: |
      (
        github.event_name == 'pull_request' &&
        github.event.pull_request.head.repo.full_name == github.repository
      ) ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.pull_request != null &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
      ) ||
      (
        github.event_name == 'pull_request_review_comment' &&
        contains(github.event.comment.body, '@claude') &&
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association) &&
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Guard — skip if ANTHROPIC_API_KEY not set
        id: guard
        env:
          HAS_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
        run: |
          if [ "$HAS_KEY" = "true" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::ANTHROPIC_API_KEY not set — Claude review skipped"
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        if: steps.guard.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      - name: Run Claude code-review
        if: steps.guard.outputs.enabled == 'true'
        uses: anthropics/claude-code-action@28f83620103c48a57093dcc2837eec89e036bb9f # v0.0.63
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # Авто-промпт для PR-открытия. На @claude меншене action автоматически
          # подхватит текст комментария — direct_prompt применяется только
          # для pull_request event.
          direct_prompt: |
            Review this PR per the project's CLAUDE.md and ECC rules.

            FOCUS (priorities from паспорт раздел W5 + B7):
            1. Security triggers — `services/mcp/**` (untrusted transcript
               injection M8.3-8.4), keychain secrets seam, audio sidecar
               permissions C1, local_engine sidecar args/path-traversal (M12.4),
               cascade delete C5 — flag any change here as CRITICAL if
               authorization/validation/PII handling is touched.
            2. Accepted limitations (CLAUDE.md / раздел 12 паспорта) — do NOT
               flag as bugs. Live constraints: R2, R3, R4, R6, R9-R13.
               R1/R5/R7/R8 are superseded (cloud segment removed in 0.3) — do
               not cite them. If a PR appears to "fix" a live constraint, flag
               as CRITICAL "scope violation, requires explicit паспорт update".
            3. Test coverage gates (cargo llvm-cov + vitest v8). For modules
               with clear algorithmic surface (matching, parsing, utilities,
               db repository, middleware) — test-first is mandatory.
            4. Конвенции: rust фигачит cargo fmt/clippy -D warnings, TS
               под strict, no `any` без обоснования, no swallowed errors.
            5. Контракты — изменения формата DiarizedTranscript/Recap/
               latest.json должны идти через `packages/contracts`,
               не дублироваться. (Прокси удалён в 0.3 — его API больше нет.)

            6. UI-правки (`.tsx`/`.css`) обязаны нести design-gate
               alignment-блок в описании PR и не содержать сырых hex/oklch
               вне token-источников. Отсутствие блока — HIGH.

            Be terse. List findings by severity: CRITICAL / HIGH / MEDIUM / LOW.
            Skip nitpicks. End with explicit "Approve" / "Block" verdict.
