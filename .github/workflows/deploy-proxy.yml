name: Deploy Proxy

# [B8.2]: split на staging (auto on main) и production (on tag v*.*.*).
# S1 паспорта: эта джоба видит ТОЛЬКО партнёрские/CF секреты, не Tauri-ключ подписи.
# GitHub Environments → отдельные secrets для staging и production.

on:
  push:
    branches: [main]
    paths:
      - 'services/proxy/**'
      - 'packages/contracts/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-proxy.yml'
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

concurrency:
  group: deploy-proxy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    name: Preflight (typecheck + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck @wotold/proxy
        run: pnpm --filter @wotold/proxy typecheck
      - name: Vitest unit @wotold/proxy
        run: pnpm --filter @wotold/proxy test:coverage
      - name: Vitest integration (миниframe) @wotold/proxy
        run: pnpm --filter @wotold/proxy test:integration

  deploy-staging:
    name: Deploy staging
    needs: preflight
    if: |
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'staging')
    runs-on: ubuntu-latest
    # GitHub Environment "staging" — protection rules + scoped secrets настраиваются в Settings.
    environment:
      name: staging
      url: https://wotold-proxy-staging.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # cloudflare/wrangler-action под капотом делает `npm i` в workingDirectory,
      # ломая pnpm workspace:* протокол на @wotold/contracts. Поэтому используем
      # wrangler напрямую через pnpm exec — он уже разрешён pnpm install выше.
      - name: Deploy via wrangler (staging)
        id: deploy
        working-directory: services/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env staging
        # Партнёрские/OAuth ключи и R2 S3 креды ставятся отдельно через
        # `wrangler secret put --env staging` (one-time). См. docs/DEPLOYMENT.md.

      - name: Post-deploy smoke (/health)
        id: smoke
        run: |
          set -euo pipefail
          URL="https://wotold-proxy-staging.workers.dev/health"
          for i in 1 2 3 4 5; do
            sleep 3
            resp=$(curl -fsS "$URL" || echo "FAIL")
            if echo "$resp" | grep -q '"ok":true'; then
              echo "smoke ok: $resp"
              exit 0
            fi
            echo "[attempt $i] $resp"
          done
          echo "smoke FAILED after 5 attempts"
          exit 1

      - name: Auto-rollback on smoke failure
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: services/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::warning::Smoke test failed, rolling back staging deployment"
          pnpm exec wrangler rollback --env staging --message "auto-rollback after smoke fail in ${{ github.run_id }}" --yes || \
            echo "::error::Rollback also failed — manual intervention required"

  deploy-production:
    name: Deploy production
    needs: preflight
    if: |
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.environment == 'production')
    runs-on: ubuntu-latest
    # GitHub Environment "production" — required reviewers / wait timer / protection rules.
    environment:
      name: production
      url: https://wotold-proxy.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Deploy via wrangler (production)
        id: deploy
        working-directory: services/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec wrangler deploy --env production

      - name: Post-deploy smoke (/health)
        id: smoke
        run: |
          set -euo pipefail
          URL="https://wotold-proxy.workers.dev/health"
          for i in 1 2 3 4 5; do
            sleep 3
            resp=$(curl -fsS "$URL" || echo "FAIL")
            if echo "$resp" | grep -q '"ok":true'; then
              echo "smoke ok: $resp"
              exit 0
            fi
            echo "[attempt $i] $resp"
          done
          echo "smoke FAILED after 5 attempts"
          exit 1

      - name: Auto-rollback on smoke failure (PRODUCTION)
        if: failure() && steps.smoke.outcome == 'failure'
        working-directory: services/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          echo "::error::Production smoke test failed, rolling back"
          pnpm exec wrangler rollback --env production --message "auto-rollback after smoke fail in ${{ github.run_id }}" --yes || \
            echo "::error::Production rollback failed — IMMEDIATE manual intervention required"
