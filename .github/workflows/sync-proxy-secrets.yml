name: Sync Proxy Secrets

# Синхронизирует partner-секреты из GitHub Repo Secrets в Cloudflare Worker secrets
# одной кнопкой. Запускается вручную через Actions → Sync Proxy Secrets.
#
# Идемпотент: если GH-секрет не задан — соответствующий wrangler secret не трогается
# (echo пустой строки + put = no-op, см. block ниже).
#
# Required GitHub Repository Secrets (per env, разделено суффиксом _STAGING/_PRODUCTION
# чтобы можно было держать разные ключи для staging vs прода — S1 паспорта):
#   ANTHROPIC_API_KEY_STAGING / ANTHROPIC_API_KEY_PRODUCTION
#   SONIOX_API_KEY_STAGING    / SONIOX_API_KEY_PRODUCTION
#   GLADIA_API_KEY_STAGING    / GLADIA_API_KEY_PRODUCTION
#   R2_ACCOUNT_ID_STAGING     / R2_ACCOUNT_ID_PRODUCTION
#   R2_ACCESS_KEY_ID_STAGING  / R2_ACCESS_KEY_ID_PRODUCTION
#   R2_SECRET_ACCESS_KEY_STAGING / R2_SECRET_ACCESS_KEY_PRODUCTION
#   GOOGLE_OAUTH_CLIENT_SECRET_STAGING / GOOGLE_OAUTH_CLIENT_SECRET_PRODUCTION
#   (опционально) APPLE_OAUTH_CLIENT_SECRET_*, MICROSOFT_OAUTH_CLIENT_SECRET_*
#
# Плюс уже существующие repo-level secrets для деплоя:
#   CLOUDFLARE_API_TOKEN  CLOUDFLARE_ACCOUNT_ID

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        type: choice
        options:
          - staging
          - production

permissions:
  contents: read

jobs:
  sync:
    name: Sync (${{ inputs.environment }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Put secrets via wrangler
        working-directory: services/proxy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV_TARGET: ${{ inputs.environment }}

          ANTHROPIC_API_KEY_STAGING: ${{ secrets.ANTHROPIC_API_KEY_STAGING }}
          ANTHROPIC_API_KEY_PRODUCTION: ${{ secrets.ANTHROPIC_API_KEY_PRODUCTION }}
          GROQ_API_KEY_STAGING: ${{ secrets.GROQ_API_KEY_STAGING }}
          GROQ_API_KEY_PRODUCTION: ${{ secrets.GROQ_API_KEY_PRODUCTION }}
          SONIOX_API_KEY_STAGING: ${{ secrets.SONIOX_API_KEY_STAGING }}
          SONIOX_API_KEY_PRODUCTION: ${{ secrets.SONIOX_API_KEY_PRODUCTION }}
          GLADIA_API_KEY_STAGING: ${{ secrets.GLADIA_API_KEY_STAGING }}
          GLADIA_API_KEY_PRODUCTION: ${{ secrets.GLADIA_API_KEY_PRODUCTION }}
          R2_ACCOUNT_ID_STAGING: ${{ secrets.R2_ACCOUNT_ID_STAGING }}
          R2_ACCOUNT_ID_PRODUCTION: ${{ secrets.R2_ACCOUNT_ID_PRODUCTION }}
          R2_ACCESS_KEY_ID_STAGING: ${{ secrets.R2_ACCESS_KEY_ID_STAGING }}
          R2_ACCESS_KEY_ID_PRODUCTION: ${{ secrets.R2_ACCESS_KEY_ID_PRODUCTION }}
          R2_SECRET_ACCESS_KEY_STAGING: ${{ secrets.R2_SECRET_ACCESS_KEY_STAGING }}
          R2_SECRET_ACCESS_KEY_PRODUCTION: ${{ secrets.R2_SECRET_ACCESS_KEY_PRODUCTION }}
          GOOGLE_OAUTH_CLIENT_SECRET_STAGING: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_STAGING }}
          GOOGLE_OAUTH_CLIENT_SECRET_PRODUCTION: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET_PRODUCTION }}
        run: |
          set -euo pipefail

          # Резолвим суффикс _STAGING vs _PRODUCTION из inputs.environment.
          SUFFIX=$(echo "$ENV_TARGET" | tr '[:lower:]' '[:upper:]')

          # Helper: put_secret <NAME> — берёт env var <NAME>_<SUFFIX>, пайпит в wrangler.
          # Если переменная пуста — пропускает с notice. Stdin без trailing newline (printf %s).
          put_secret() {
            local name="$1"
            local var="${name}_${SUFFIX}"
            local value="${!var:-}"
            if [ -z "$value" ]; then
              echo "::notice::skip ${name} (env ${var} not set in GitHub Secrets)"
              return 0
            fi
            echo "::group::put ${name} → ${ENV_TARGET}"
            printf '%s' "$value" | pnpm exec wrangler secret put "$name" --env "$ENV_TARGET"
            echo "::endgroup::"
          }

          for name in \
            ANTHROPIC_API_KEY \
            GROQ_API_KEY \
            SONIOX_API_KEY \
            GLADIA_API_KEY \
            R2_ACCOUNT_ID \
            R2_ACCESS_KEY_ID \
            R2_SECRET_ACCESS_KEY \
            GOOGLE_OAUTH_CLIENT_SECRET; do
            put_secret "$name"
          done

      - name: Summary
        run: |
          {
            echo "## Secrets sync ${{ inputs.environment }}"
            echo ""
            echo "Запущен \`wrangler secret put\` для каждого NAME с заданным значением"
            echo "(${{ inputs.environment }} suffix в GitHub Secrets)."
            echo ""
            echo "Список ставит \`wrangler secret list --env ${{ inputs.environment }}\` локально."
          } >> "$GITHUB_STEP_SUMMARY"
