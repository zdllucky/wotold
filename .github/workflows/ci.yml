name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # [Cost] Path-based change detection. Без этого каждый push в main гонял
  # 6 jobs (2 на macOS × $0.08/min) = ~$1.70 за commit. С фильтрами docs-only
  # коммит запускает 1 ubuntu job (~$0.05), а Rust-changes-only пропускает TS.
  # На моих типичных commit'ах экономия ~70%.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      versions: ${{ steps.filter.outputs.versions }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/sidecars/**'
              - 'scripts/build-audio-sidecar.sh'
              - '.github/workflows/ci.yml'
            ts:
              - 'apps/desktop/src/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.ts'
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/tsconfig*.json'
              - 'services/proxy/**'
              - 'services/mcp/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            migrations:
              - 'apps/desktop/src-tauri/migrations/**'
              - 'scripts/check-migrations.mjs'
              - '.github/workflows/ci.yml'
            versions:
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/tauri.conf.json'
              - 'apps/desktop/package.json'
              - 'package.json'
              - 'scripts/check-versions.mjs'
              - '.github/workflows/ci.yml'

  version-sync:
    name: Version sync (M11.5)
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs

  typescript:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck @wotold/contracts
        run: pnpm --filter @wotold/contracts exec tsc --noEmit
      - name: Typecheck @wotold/proxy
        run: pnpm --filter @wotold/proxy typecheck
      - name: Typecheck @wotold/desktop
        run: pnpm --filter @wotold/desktop typecheck
      - name: Typecheck @wotold/mcp
        run: pnpm --filter @wotold/mcp typecheck

  ts-tests:
    name: TS tests + coverage
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest @wotold/desktop (with coverage)
        run: pnpm --filter @wotold/desktop test:coverage
      - name: Vitest @wotold/proxy unit (with coverage)
        run: pnpm --filter @wotold/proxy test:coverage
      - name: Vitest @wotold/proxy integration (миниframe)
        run: pnpm --filter @wotold/proxy test:integration
      - name: Vitest @wotold/mcp (with coverage)
        run: pnpm --filter @wotold/mcp test:coverage
      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: |
            apps/desktop/coverage/**
            services/proxy/coverage/**
            services/mcp/coverage/**
          if-no-files-found: warn
          retention-days: 7

  check-migrations:
    name: SQLx migrations filename verification
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify migration filename ordering
        run: node scripts/check-migrations.mjs

  # [Cost] Rust fmt + check + clippy теперь на Linux (×1 minute cost vs
  # macOS ×10). cfg(target_os="macos") модули скипаются автоматически —
  # cargo не компилирует их под Linux target, что нам нужно: проверяем
  # портабельный код в дешёвом runner'е. macOS-only ветки покрывает
  # rust-tests job.
  #
  # Tauri-build (build script) требует:
  #   1. WebKit2GTK + GTK dev libs (apt) — для wry runtime crate
  #   2. Stub sidecar binary в `binaries/wotold-audio-<target-triple>` —
  #      build.rs валидирует externalBin existence, не содержимое.
  rust-lint:
    name: Rust fmt + check + clippy (Linux)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      - name: Install Tauri Linux deps (libwebkit2gtk + gtk3)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev
      - name: Stub sidecar binary (Linux fast lint — Swift sidecar собирается на macOS test job)
        run: |
          TARGET="x86_64-unknown-linux-gnu"
          mkdir -p apps/desktop/src-tauri/binaries
          touch "apps/desktop/src-tauri/binaries/wotold-audio-${TARGET}"
          chmod +x "apps/desktop/src-tauri/binaries/wotold-audio-${TARGET}"
      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # [Cost] Rust tests остаются на macOS-latest:
  #   - cfg(target_os="macos") модули audio/macos.rs + audio/permissions.rs
  #     не компилируются на Linux → их тесты на Linux недостижимы
  #   - sqlx integration с Swift sidecar (используется в pipeline tests)
  #   - cargo-llvm-cov генерация lcov.info
  # Coverage и polyfill реальный — без macOS не пропустим.
  rust-tests:
    name: Rust tests + coverage (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          shared-key: rust-tests
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build Swift audio sidecar
        run: ./scripts/build-audio-sidecar.sh
      - name: cargo test + coverage (lcov)
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      # [Phase 1] Coverage gate. Текущий honest baseline ~35-45% line coverage
      # (pipeline/mod.rs + commands.rs + recap::run пока полностью dark).
      # Поэтапно поднимем к 60-65% после Phase 2-6. 80% паспорта достижим
      # только через E2E (Playwright) — отдельный B-уровень backlog.
      - name: Coverage gate (fail-under 40% lines)
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov report --fail-under-lines 40
      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: apps/desktop/src-tauri/lcov.info
          if-no-files-found: warn
          retention-days: 7
