name: CI

# [TD-02] Все actions запинены на полный commit-SHA; трейлинг-комментарий (# vX.Y.Z)
# — машинный контракт с Dependabot, он бампает SHA и версию вместе.
# Причина: mutable-теги (@v4, @beta, @stable) переписываются владельцем action'а,
# и компрометация тега = выполнение чужого кода на раннере с нашими секретами.
# Не заменять SHA обратно на тег — Dependabot сам предложит апгрейд PR'ом.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

jobs:
  # [Cost] Path-based change detection. Без этого каждый push в main гонял
  # 6 jobs (2 на macOS × $0.08/min) = ~$1.70 за commit. С фильтрами docs-only
  # коммит запускает 1 ubuntu job (~$0.05), а Rust-changes-only пропускает TS.
  # На моих типичных commit'ах экономия ~70%.
  changes:
    name: Detect changed paths
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      ts: ${{ steps.filter.outputs.ts }}
      migrations: ${{ steps.filter.outputs.migrations }}
      versions: ${{ steps.filter.outputs.versions }}
      site: ${{ steps.filter.outputs.site }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@d1c1ffe0248fe513906c8e24db8ea791d46f8590 # v3.0.3
        id: filter
        with:
          filters: |
            rust:
              - 'apps/desktop/src-tauri/**'
              - 'apps/desktop/sidecars/**'
              - 'scripts/build-audio-sidecar.sh'
              - '.github/workflows/ci.yml'
            ts:
              - 'apps/desktop/src/**'
              - 'apps/desktop/package.json'
              - 'apps/desktop/vite.config.ts'
              - 'apps/desktop/vitest.config.ts'
              - 'apps/desktop/tsconfig*.json'
              - 'services/mcp/**'
              - 'packages/**'
              - 'pnpm-lock.yaml'
              - 'pnpm-workspace.yaml'
              - 'package.json'
              - '.github/workflows/ci.yml'
            migrations:
              - 'apps/desktop/src-tauri/migrations/**'
              - 'scripts/check-migrations.mjs'
              - '.github/workflows/ci.yml'
            versions:
              - 'apps/desktop/src-tauri/Cargo.toml'
              - 'apps/desktop/src-tauri/tauri.conf.json'
              - 'apps/desktop/package.json'
              - 'package.json'
              - 'scripts/check-versions.mjs'
              - '.github/workflows/ci.yml'
            site:
              - 'apps/site/**'
              # Сайт импортирует токены и примитивы из десктопа напрямую и
              # синхронизирует оттуда же шрифты. Правка любого из этих файлов
              # способна сломать сборку сайта, не тронув ни строки в apps/site.
              - 'apps/desktop/src/styles/tokens.css'
              - 'apps/desktop/src/styles/wk.css'
              - 'apps/desktop/src/styles/fonts.css'
              - 'apps/desktop/public/fonts/**'
              - 'scripts/check-site-assets.mjs'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'

  version-sync:
    name: Version sync (M11.5)
    needs: changes
    if: needs.changes.outputs.versions == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs

  typescript:
    name: TypeScript typecheck
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck @wotold/contracts
        run: pnpm --filter @wotold/contracts exec tsc --noEmit
      - name: Typecheck @wotold/desktop
        run: pnpm --filter @wotold/desktop typecheck
      - name: Typecheck @wotold/mcp
        run: pnpm --filter @wotold/mcp typecheck
      # [TD-31] Ratchet: инлайн-стилей не должно становиться больше. Токен-
      # дисциплина по цвету enforced хуком, по типографике и spacing — нет;
      # это не даёт долгу расти, пока он сводится по мере касания файлов.
      - name: Inline-style budget
        run: node scripts/inline-style-budget.mjs --check

  ts-tests:
    name: TS tests + coverage
    needs: changes
    if: needs.changes.outputs.ts == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest @wotold/desktop (with coverage)
        run: pnpm --filter @wotold/desktop test:coverage
      - name: Vitest @wotold/mcp (with coverage)
        run: pnpm --filter @wotold/mcp test:coverage
      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ts-coverage
          path: |
            apps/desktop/coverage/**
            services/mcp/coverage/**
          if-no-files-found: warn
          retention-days: 7

  # Сайт проверяется на PR, деплоится отдельным workflow (pages.yml) и только
  # с main. Без этой джобы правка сайта уезжала бы в main непроверенной, а
  # узнавали бы мы о поломке уже из упавшего деплоя.
  site:
    name: Site build (Astro)
    needs: changes
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck (astro check)
        run: pnpm --filter @wotold/site check
      - name: Build
        run: pnpm --filter @wotold/site build
      # Два инварианта, которые глазами не ловятся: ноль запросов на сторонние
      # хосты (регресс добавляется одной строкой в шаблоне) и целостность
      # внутренних ссылок в трёх локалях.
      - name: Verify assets and links
        run: node scripts/check-site-assets.mjs apps/site/dist

  check-migrations:
    name: SQLx migrations filename verification
    needs: changes
    if: needs.changes.outputs.migrations == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - name: Verify migration filename ordering
        run: node scripts/check-migrations.mjs

  # [CI-fix] Rust lint на macOS — НЕ Linux. Изначальный замысел («дешёвый
  # Linux runner проверяет портабельный код, macOS-only модули auto-skip»)
  # неверен: `audio/mod.rs` имеет `compile_error!("только macOS", R4)`, а
  # `local_engine` (`#[cfg(target_os="macos")]`, M12/R9) ссылается
  # безусловно из pipeline/* + commands/* → E0433 на Linux. Crate
  # компилируется ТОЛЬКО на macOS. Поэтому fmt/check/clippy идут там же где
  # rust-tests. Sidecar бинари: llama/whisper aarch64 закоммичены, audio
  # собирается build-audio-sidecar.sh — build script проходит resource-check.
  rust-lint:
    name: Rust fmt + check + clippy (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # [TD-02] toolchain задан явно: эта action берёт тулчейн из ИМЕНИ ref'а
          # (@stable), а после SHA-пина имени больше нет.
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          shared-key: rust-lint
      - name: Build Swift audio sidecar
        run: ./scripts/build-audio-sidecar.sh
      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  # [Cost] Rust tests остаются на macOS-latest:
  #   - cfg(target_os="macos") модули audio/macos.rs + audio/permissions.rs
  #     не компилируются на Linux → их тесты на Linux недостижимы
  #   - sqlx integration с Swift sidecar (используется в pipeline tests)
  #   - cargo-llvm-cov генерация lcov.info
  # Coverage и polyfill реальный — без macOS не пропустим.
  rust-tests:
    name: Rust tests + coverage (macOS)
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # [TD-02] см. выше — тулчейн из имени ref'а, после пина задаём явно.
          toolchain: stable
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          shared-key: rust-tests
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@75a348306ce8f67c0b06fc62c32a8546140ba955 # cargo-llvm-cov
        with:
          # [TD-02] tool задан явно: эта action выбирает инструмент по ИМЕНИ ref'а
          # (@cargo-llvm-cov), а после SHA-пина имени больше нет.
          tool: cargo-llvm-cov
      - name: Build Swift audio sidecar
        run: ./scripts/build-audio-sidecar.sh
      - name: cargo test + coverage (lcov)
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      # [Phase 1-6] Coverage gate. После 6-фазного рефактора + integration
      # тестов для pipeline + state machine + voice_backfill + proptest на
      # cosine_similarity baseline должен подняться к 50%+. Поднимаем gate
      # consequently — если CI упадёт, значит ушли в регрессию.
      # 80% паспорта достижим только через E2E (Playwright) — backlog B-level.
      - name: Coverage gate (fail-under 50% lines)
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov report --fail-under-lines 50
      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rust-coverage
          path: apps/desktop/src-tauri/lcov.info
          if-no-files-found: warn
          retention-days: 7
