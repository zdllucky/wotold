name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  version-sync:
    name: Version sync (M11.5)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/check-versions.mjs

  typescript:
    name: TypeScript typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Typecheck @wotold/contracts
        run: pnpm --filter @wotold/contracts exec tsc --noEmit
      - name: Typecheck @wotold/proxy
        run: pnpm --filter @wotold/proxy typecheck
      - name: Typecheck @wotold/desktop
        run: pnpm --filter @wotold/desktop typecheck
      - name: Typecheck @wotold/mcp
        run: pnpm --filter @wotold/mcp typecheck

  ts-tests:
    name: TS tests + coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Vitest @wotold/desktop (with coverage)
        run: pnpm --filter @wotold/desktop test:coverage
      - name: Vitest @wotold/proxy unit (with coverage)
        run: pnpm --filter @wotold/proxy test:coverage
      - name: Vitest @wotold/proxy integration (миниframe)
        run: pnpm --filter @wotold/proxy test:integration
      - name: Vitest @wotold/mcp (with coverage)
        run: pnpm --filter @wotold/mcp test:coverage
      - name: Upload coverage artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ts-coverage
          path: |
            apps/desktop/coverage/**
            services/proxy/coverage/**
            services/mcp/coverage/**
          if-no-files-found: warn
          retention-days: 7

  check-migrations:
    name: SQLx migrations verification
    runs-on: ubuntu-latest
    # Отдельная джоба: не зависит от audio sidecar (macOS-only),
    # проверяет что migrations 0001..N последовательны и применяются
    # к чистой SQLite. Падает при разрыве нумерации, дубликатах или
    # ошибках SQL — гарантия что миграции forward-only и не reorder'нуты.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify migration filename ordering
        run: node scripts/check-migrations.mjs
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          shared-key: check-migrations
      - name: Stub audio sidecar (Linux CI — tauri-build ожидает externalBin)
        run: |
          mkdir -p apps/desktop/src-tauri/binaries
          # tauri-build резолвит externalBin по host-triple. На ubuntu-latest = x86_64-unknown-linux-gnu.
          touch apps/desktop/src-tauri/binaries/wotold-audio-x86_64-unknown-linux-gnu
          chmod +x apps/desktop/src-tauri/binaries/wotold-audio-x86_64-unknown-linux-gnu
      - name: cargo test db migrations
        working-directory: apps/desktop/src-tauri
        # Прогоняем только модуль db::tests — он применяет миграции к свежей
        # SQLite через sqlx::migrate!() и проверяет схему. Compile-time проверка
        # самого макроса гарантирует что SQL валиден.
        run: cargo test --lib db::tests --no-fail-fast

  rust:
    name: Rust check + clippy + fmt
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
      # tauri.conf.json объявляет externalBin = binaries/wotold-audio;
      # без сборки sidecar'а tauri-build падает с "resource path doesn't exist".
      - name: Build Swift audio sidecar
        run: ./scripts/build-audio-sidecar.sh
      - name: cargo fmt --check
        working-directory: apps/desktop/src-tauri
        run: cargo fmt --all -- --check
      - name: cargo check
        working-directory: apps/desktop/src-tauri
        run: cargo check --all-targets
      - name: cargo clippy
        working-directory: apps/desktop/src-tauri
        run: cargo clippy --all-targets -- -D warnings

  rust-tests:
    name: Rust tests + coverage
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'
          shared-key: rust-tests
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov
      - name: Build Swift audio sidecar
        run: ./scripts/build-audio-sidecar.sh
      - name: cargo test + coverage (lcov)
        working-directory: apps/desktop/src-tauri
        run: cargo llvm-cov --all-features --workspace --lcov --output-path lcov.info
      - name: Upload coverage artefact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rust-coverage
          path: apps/desktop/src-tauri/lcov.info
          if-no-files-found: warn
          retention-days: 7
