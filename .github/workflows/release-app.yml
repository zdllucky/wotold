name: Release Desktop App

# [TD-02] Все actions запинены на полный commit-SHA; трейлинг-комментарий (# vX.Y.Z)
# — машинный контракт с Dependabot, он бампает SHA и версию вместе.
# Причина: mutable-теги (@v4, @beta, @stable) переписываются владельцем action'а,
# и компрометация тега = выполнение чужого кода на раннере с нашими секретами.
# Не заменять SHA обратно на тег — Dependabot сам предложит апгрейд PR'ом.

# Раздел 16.3 паспорта: тег vX.Y.Z → собранный подписанный релиз.
# S1 паспорта: эта джоба видит только Tauri-ключ подписи, не партнёрские ключи.

on:
  # Ручной путь: `git tag vX.Y.Z && git push --tags`.
  push:
    tags:
      - 'v*'
  # Основной путь: вызов из release.yml сразу после того, как тот создал тег.
  # Отдельный триггер нужен потому, что тег, запушенный с GITHUB_TOKEN, по
  # правилам GitHub не запускает workflow — на push-триггере цепочка молча
  # обрывалась бы.
  workflow_call:
    inputs:
      tag:
        type: string
        required: true

permissions:
  contents: write
  pull-requests: write

jobs:
  # Имя тега резолвится джобой, а не workflow-level `env`: файл обязан быть
  # валиден и для push-триггера, где контекста `inputs` не существует вовсе.
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - id: tag
        run: echo "tag=${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  version-sync:
    name: Version sync (M11.5)
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
      - env:
          GITHUB_REF_TYPE: tag
          GITHUB_REF_NAME: ${{ needs.resolve.outputs.tag }}
        run: node scripts/check-versions.mjs

  changelog:
    name: Generate CHANGELOG (git-cliff)
    needs: resolve
    runs-on: ubuntu-latest
    outputs:
      release_body: ${{ steps.cliff-release.outputs.content }}
      mandatory_prefix: ${{ steps.mandatory.outputs.prefix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}
      # Полный CHANGELOG.md для коммита в main (если меняется).
      - name: Generate full CHANGELOG.md
        id: cliff-full
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose
        env:
          OUTPUT: CHANGELOG.md
      # Только release notes для текущего тега — пойдёт в releaseBody.
      - name: Generate release notes for current tag
        id: cliff-release
        uses: orhun/git-cliff-action@f50e11560dce63f7c33227798f90b924471a88b5 # v4.8.0
        with:
          config: cliff.toml
          args: --verbose --latest --strip header
      # Признак обязательности кладёт release.yml в тело аннотированного тега.
      # Отсюда он переезжает первой строкой release notes: latest.json целиком
      # генерирует tauri-action, своих полей туда не добавить, а notes —
      # единственное поле манифеста, которое доезжает до клиента.
      # Читает его updater::classify.
      - name: Resolve mandatory marker from tag
        id: mandatory
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          BODY=$(git for-each-ref "refs/tags/${TAG}" --format='%(contents:body)')
          if printf '%s' "$BODY" | grep -qx '!mandatory'; then
            echo 'prefix=!mandatory' >> "$GITHUB_OUTPUT"
            echo "::notice::Релиз помечен обязательным — клиенты поставят его сами."
          else
            echo 'prefix=' >> "$GITHUB_OUTPUT"
          fi

      - name: Commit CHANGELOG.md back to main (if changed)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if git diff --quiet CHANGELOG.md; then
            echo "CHANGELOG.md не изменился — пропускаем коммит"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -B chore/changelog-${{ needs.resolve.outputs.tag }}
          git add CHANGELOG.md
          git commit -m "docs(changelog): update for ${{ needs.resolve.outputs.tag }}"
          # Пушим в branch и открываем PR — main защищён protection rules,
          # бот не имеет прав push'а напрямую (W5 паспорта).
          git push origin "chore/changelog-${{ needs.resolve.outputs.tag }}" || true
          gh pr create \
            --base main \
            --head "chore/changelog-${{ needs.resolve.outputs.tag }}" \
            --title "docs(changelog): ${{ needs.resolve.outputs.tag }}" \
            --body "Auto-generated by release workflow on tag push." \
            || echo "PR already exists or push не удался — manual fixup"

  build:
    needs: [resolve, version-sync, changelog]
    # [B16 audit P0]: одна macos-14 runner вместо matrix macos-13 x86_64 +
    # macos-14 aarch64. Tauri универсальный target `universal-apple-darwin`
    # собирает fat binary под обе архитектуры — юзеры не путают какой DMG.
    runs-on: macos-14
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: pnpm

      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          # [TD-02] toolchain задан явно: эта action берёт тулчейн из ИМЕНИ ref'а
          # (@stable), а после SHA-пина имени больше нет.
          toolchain: stable
          targets: aarch64-apple-darwin

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: 'apps/desktop/src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - name: Tauri build + GitHub Release
        uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1.0.0
        env:
          # Tauri minisign подписи (M11.1 + S1 паспорта).
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # R6 паспорта: Apple-нотаризация = DEFERRED.
          # Когда добавим Developer ID — раскомментировать секреты ниже,
          # tauri-action автоматически подпишет и нотаризует, если они заданы.
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop/src-tauri
          # [TD-01] Один ключ args: — раньше их было два (voice-onnx и target),
          # YAML last-wins молча съедал первый. Флаги слиты.
          #
          # [B3.7] voice-onnx указан явно, хотя с B25 он уже в default
          # (Cargo.toml [features]) — страховка: если default когда-нибудь
          # переберут, релизный .dmg не должен молча уехать без
          # биометрического матчинга.
          # Только Apple Silicon. `universal-apple-darwin` тут стоял
          # аспирационно и собраться не мог: во-первых, `ort` не публикует
          # пребилтов ONNX Runtime под x86_64-apple-darwin; во-вторых — и это
          # решающее — в `binaries/` лежат исключительно aarch64-сайдкары
          # (llama, llama-server, whisper). Даже собравшись, fat-бинарь на
          # Intel упал бы на первом распознавании.
          args: --features voice-onnx --target aarch64-apple-darwin
          tagName: ${{ needs.resolve.outputs.tag }}
          releaseName: 'Wotold ${{ needs.resolve.outputs.tag }}'
          releaseBody: |
            ${{ needs.changelog.outputs.mandatory_prefix }}
            ${{ needs.changelog.outputs.release_body }}

            ---

            **Установка:** см. README.md.

            **Внимание (R6):** в MVP-сборке Apple-нотаризация отключена. При
            первом запуске Gatekeeper потребует «Открыть всё равно» через
            Системные Настройки → Конфиденциальность и Безопасность.
          releaseDraft: false
          prerelease: false
          # M11.2: latest.json генерируется tauri-action для updater'а.
          includeUpdaterJson: true

      # Имя DMG от tauri-action содержит версию, поэтому «ссылка на
      # последний» из него не строится. Кладём в тот же релиз копию под
      # постоянным именем: на неё смотрят кнопка на сайте и Homebrew-каск.
      - name: Publish version-independent DMG
        id: dmg
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # target/ лежит в КОРНЕ репозитория, а не рядом с манифестом:
          # это Cargo-воркспейс, и артефакты у него общие.
          BUNDLE=target/aarch64-apple-darwin/release/bundle/dmg
          SRC=$(find "$BUNDLE" -maxdepth 1 -name '*.dmg' | head -1)
          if [ -z "$SRC" ]; then
            echo "::error::DMG не найден в $BUNDLE — сборка не дала артефакт"
            exit 1
          fi
          cp "$SRC" /tmp/Wotold-arm64.dmg
          gh release upload "$TAG" /tmp/Wotold-arm64.dmg --clobber
          SHA=$(shasum -a 256 /tmp/Wotold-arm64.dmg | cut -d' ' -f1)
          echo "sha256=$SHA" >> "$GITHUB_OUTPUT"
          echo "- DMG sha256: \`$SHA\`" >> "$GITHUB_STEP_SUMMARY"

      # Обновление Homebrew-каска сюда НЕ входит намеренно. Толкать его
      # отсюда в чужой репозиторий значило бы держать кросс-репозиторный PAT
      # ради одной строки в .rb — лишний долгоживущий секрет в релизной джобе,
      # которая и так носит ключ подписи. Тап забирает релиз сам, по
      # публичному API: .github/workflows/sync-cask.yml в zdllucky/homebrew-wotold.

      # [TD-01] Ad-hoc подпись переехала в tauri.conf.json
      # (bundle.macOS.signingIdentity = "-"). Здесь раньше стоял отдельный шаг
      # codesign — он бежал ПОСЛЕ того как tauri-action уже собрал .dmg и
      # выложил ассеты в Release, подписывал .app вместо публикуемого .dmg,
      # и глушил ошибку через `|| echo`. То есть заявленная митигация R6
      # («damaged, move to trash» → «Open anyway») фактически не работала.
      # Bundler подписывает .app ДО сборки .dmg — подпись попадает в артефакт.
