name: Commitlint

# [TD-02] Все actions запинены на полный commit-SHA; трейлинг-комментарий (# vX.Y.Z)
# — машинный контракт с Dependabot, он бампает SHA и версию вместе.
# Причина: mutable-теги (@v4, @beta, @stable) переписываются владельцем action'а,
# и компрометация тега = выполнение чужого кода на раннере с нашими секретами.
# Не заменять SHA обратно на тег — Dependabot сам предложит апгрейд PR'ом.

# [B8.7]: проверяет conventional commits в PR заголовке и в каждом коммите
# которые PR добавляет к base. Config в .commitlintrc.json.
#
# Падение блокирует merge → принуждает feat/fix/docs/... prefix.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint PR title + commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # wagoid/commitlint-github-action использует Docker action со встроенным
      # commitlint + @commitlint/config-conventional. Не плодим dev-deps в repo.
      - name: Lint commits in PR
        uses: wagoid/commitlint-github-action@b948419dd99f3fd78a6548d48f94e3df7f6bf3ed # v6.2.1
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
          helpURL: https://www.conventionalcommits.org/

      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@e32d7e603df1aa1ba07e981f2a23455dee596825 # v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci
            build
            style
            revert
          requireScope: false
          subjectPattern: '^.+$'
          subjectPatternError: |
            PR title subject required. Format: <type>(<scope>?): <subject>
            Example: feat(auth): добавить Google OIDC callback
