name: Commitlint

# [B8.7]: проверяет conventional commits в PR заголовке и в каждом коммите
# которые PR добавляет к base. Config в .commitlintrc.json.
#
# Падение блокирует merge → принуждает feat/fix/docs/... prefix.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: Lint PR title + commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # wagoid/commitlint-github-action использует Docker action со встроенным
      # commitlint + @commitlint/config-conventional. Не плодим dev-deps в repo.
      - name: Lint commits in PR
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: .commitlintrc.json
          failOnWarnings: false
          helpURL: https://www.conventionalcommits.org/

      - name: Lint PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            refactor
            docs
            test
            chore
            perf
            ci
            build
            style
            revert
          requireScope: false
          subjectPattern: '^.+$'
          subjectPatternError: |
            PR title subject required. Format: <type>(<scope>?): <subject>
            Example: feat(auth): добавить Google OIDC callback
