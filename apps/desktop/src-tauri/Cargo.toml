[package]
name = "wotold-desktop"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
description = "Wotold — call recorder with diarization (Tauri 2)"

[lib]
name = "wotold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
tauri-plugin-deep-link = "^2"

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"

[features]
default = []
# Реализация macOS-аудио живёт под этим cfg (M1.2). Включится в Этапе 2.
audio-macos = []
# Windows-захват = unimplemented (R4). Фича-флаг для будущего.
audio-windows = []
