[package]
name = "wotold-desktop"
version = "0.10.0"
edition = "2021"
rust-version = "1.77"
description = "Wotold — call recorder with diarization (Tauri 2)"

[lib]
name = "wotold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["macos-private-api", "protocol-asset", "tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
# [S4] Native macOS notification — поднимаем баннер с «Старт» action когда
# auto-detect probe (S2/S3) видит начало звонка.
tauri-plugin-notification = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
tauri-plugin-deep-link = "^2"
# [B16 audit P0]: предотвращаем second instance — иначе wotold:// deep-link
# открывает новое окно поверх существующего, и две копии гонятся за
# одной SQLite БД (corruption).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
hound = "3.5.1"
# [B3.7c] SHA256 для verify скачанной voice-embedder модели.
sha2 = "0.10"
# Streaming HTTP body для download прогресса (reqwest::Response::bytes_stream).
futures-util = "0.3"

# [B3.7] Voice biometric ONNX inference — optional. Включается через
# `--features voice-onnx`. Используем официальный `sherpa-onnx` Rust crate
# (k2-fsa) который wrap'ит весь pipeline: Kaldi-style mel fbank + ONNX
# inference (WeSpeaker / 3D-Speaker / NeMo TitaNet) + L2 normalize.
# Static link по умолчанию, build script тянет prebuilt ONNX Runtime libs.
#
# Альтернативы рассмотрены и отклонены в research:
# - `ort` crate + `kaldi-native-fbank` — больше control, но требует ручную
#   wire (frame extraction, feature aggregation, ONNX inference, L2 norm).
#   Риск: implementation drift от Kaldi reference → garbage embeddings.
# - `sherpa-rs` — deprecated; upstream рекомендует прямой sherpa-onnx.
#
# WeSpeaker model файл (~26MB) НЕ bundled в репо. Cluster pipeline
# fallback'ит на StubEmbedder если модели нет в `$APP_DATA/models/embedder.onnx`.
# Скачивание модели — runtime download через https + checksum (B3.7c TODO).
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"], optional = true }

# [M15.9] Текст-эмбеддер ассистента (`assistant/embedder.rs`) — optional,
# включается `--features assistant-embed`. Спайк M15.9: fastembed отклонён
# (TokenizerFiles требует 4 файла токенизатора → 5 SHA-записей каталога
# против 2 у прямого пути; дефолт-фичи тянут hf-hub + image-models).
# ort default-фичи включают download-binaries: build script качает prebuilt
# ONNX Runtime — тот же сетевой прецедент, что sherpa-onnx выше.
# tokenizers: onig достаточно для XLM-R tokenizer.json (Unigram).
ort = { version = "=2.0.0-rc.12", features = ["ndarray"], optional = true }
tokenizers = { version = "0.21", default-features = false, features = ["onig"], optional = true }
ndarray = { version = "0.17", optional = true }

# [Widget v4] objc для прямого вызова NSWindow.setMovableByWindowBackground —
# единственный надёжный способ сделать transparent + decorations:false окно
# draggable со всех точек (включая тачпад, где IPC-based startDragging
# не успевает за быстрым tap-press-release циклом).
[target."cfg(target_os = \"macos\")".dependencies]
objc = "0.2"
# [B27.6] Нативный share-пикер: типизированный objc2-стек (уже в Cargo.lock
# транзитивно через wry) — NSRect/MainThreadOnly без ручного unsafe Encode.
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSGeometry", "NSObject", "NSData"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSSharingService", "NSView", "NSWindow", "NSResponder", "NSGraphics", "NSApplication", "NSImage"] }

[dev-dependencies]
httpmock = "0.8"
tempfile = "3"
# Виртуальные часы для тестов с ожиданием (`#[tokio::test(start_paused)]`).
# В feature-набор `full` не входит намеренно — он меняет поведение рантайма,
# поэтому включается только в тестовом профиле. Правило 6 CLAUDE.md: тесты не
# синхронизируются реальным временем.
tokio = { version = "1", features = ["test-util"] }
# [Phase 6] proptest — property-based для invariant'ов (cosine, rank, wav).
proptest = "1.5"
# [Phase 6] rstest — parameterized cases (collapse 4 retry-classification tests).
rstest = "0.23"

[features]
# [B25] assistant-embed в default: без него семантический поиск ассистента
# мёртв в prod/dev-бинаре (деградация до BM25 навсегда). Паттерн voice-onnx.
default = ["voice-onnx", "assistant-embed"]
# Реализация macOS-аудио живёт под этим cfg (M1.2). Включится в Этапе 2.
audio-macos = []
# Windows-захват = unimplemented (R4). Фича-флаг для будущего.
audio-windows = []
# [B3.7] Включает OnnxEmbedder (ort + ndarray + Kaldi fbank preprocessing).
# В default с B25 (см. выше) — без него биометрический матчинг мёртв.
voice-onnx = ["dep:sherpa-onnx"]
# [M15.9] ONNX-реализация текст-эмбеддера ассистента (retrieval Ph2).
# В default с B25: без него семантический поиск деградирует до BM25 навсегда.
assistant-embed = ["dep:ort", "dep:tokenizers", "dep:ndarray"]

# [B16 audit P1]: жёстче политика на unsafe code и common pitfalls.
# unsafe_code deny — pure-Rust core за исключением single FFI хелпера
# (NSWindow.setMovableByWindowBackground в lib.rs, см. Widget v4). Allow
# на той функции локализован через #[allow(unsafe_code)].
[lints.rust]
unsafe_code = "deny"
# objc 0.2 sel_impl! macro emits `cfg(cargo-clippy)` checks которые
# новые rustc/clippy флагят как unexpected. 3rd-party шум, не наш баг.
unexpected_cfgs = { level = "allow", check-cfg = ['cfg(cargo_clippy)'] }

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
# Pre-existing pattern в diarization.rs (sherpa-onnx config builder).
# Не refactor'им потому что это код M12-D5 не из текущей сессии.
field_reassign_with_default = "allow"
