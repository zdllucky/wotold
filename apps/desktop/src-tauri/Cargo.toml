[package]
name = "wotold-desktop"
version = "0.0.1"
edition = "2021"
rust-version = "1.77"
description = "Wotold — call recorder with diarization (Tauri 2)"

[lib]
name = "wotold_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-log = "2"
tauri-plugin-shell = "2"
tauri-plugin-updater = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

sqlx = { version = "0.8", default-features = false, features = [
    "runtime-tokio",
    "sqlite",
    "migrate",
    "macros",
] }
tokio = { version = "1", features = ["full"] }
uuid = { version = "1", features = ["v4", "serde"] }
async-trait = "0.1"
anyhow = "1"
thiserror = "2"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
semver = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "multipart", "stream"] }
keyring = { version = "3.6.3", features = ["apple-native"] }
tauri-plugin-deep-link = "^2"
# [B16 audit P0]: предотвращаем second instance — иначе wotold:// deep-link
# открывает новое окно поверх существующего, и две копии гонятся за
# одной SQLite БД (corruption).
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
hound = "3.5.1"
# [B3.7c] SHA256 для verify скачанной voice-embedder модели.
sha2 = "0.10"
# Streaming HTTP body для download прогресса (reqwest::Response::bytes_stream).
futures-util = "0.3"

# [B3.7] Voice biometric ONNX inference — optional. Включается через
# `--features voice-onnx`. Используем официальный `sherpa-onnx` Rust crate
# (k2-fsa) который wrap'ит весь pipeline: Kaldi-style mel fbank + ONNX
# inference (WeSpeaker / 3D-Speaker / NeMo TitaNet) + L2 normalize.
# Static link по умолчанию, build script тянет prebuilt ONNX Runtime libs.
#
# Альтернативы рассмотрены и отклонены в research:
# - `ort` crate + `kaldi-native-fbank` — больше control, но требует ручную
#   wire (frame extraction, feature aggregation, ONNX inference, L2 norm).
#   Риск: implementation drift от Kaldi reference → garbage embeddings.
# - `sherpa-rs` — deprecated; upstream рекомендует прямой sherpa-onnx.
#
# WeSpeaker model файл (~26MB) НЕ bundled в репо. Cluster pipeline
# fallback'ит на StubEmbedder если модели нет в `$APP_DATA/models/embedder.onnx`.
# Скачивание модели — runtime download через https + checksum (B3.7c TODO).
sherpa-onnx = { version = "1.13", default-features = false, features = ["static"], optional = true }

[dev-dependencies]
httpmock = "0.7"
tempfile = "3"
# [Phase 6] proptest — property-based для invariant'ов (cosine, rank, wav).
proptest = "1.5"
# [Phase 6] rstest — parameterized cases (collapse 4 retry-classification tests).
rstest = "0.23"

[features]
default = []
# Реализация macOS-аудио живёт под этим cfg (M1.2). Включится в Этапе 2.
audio-macos = []
# Windows-захват = unimplemented (R4). Фича-флаг для будущего.
audio-windows = []
# [B3.7] Включает OnnxEmbedder (ort + ndarray + Kaldi fbank preprocessing).
# Production-сборка включает; default off для быстрого dev build.
voice-onnx = ["dep:sherpa-onnx"]

# [B16 audit P1]: жёстче политика на unsafe code и common pitfalls.
# unsafe_code forbid — у нас pure-Rust core, нет нужды в unsafe.
# unwrap_used / expect_used — warn (не deny чтобы не блочить tests).
[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
